services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      - GENERATE_DEMO_DATA=true # generate demo leads if db is empty (first time running app)
    volumes:
      - sqlite_data:/app/data
    command: ["sh", "-c", "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"]

volumes:
  sqlite_data: